<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DETONACIÓN - Radio Boss Online</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;padding:15px}
.header{text-align:center;padding:15px;background:linear-gradient(90deg,#ff0000,#ff6600);border-radius:15px;margin-bottom:15px}
.header h1{font-size:28px;letter-spacing:2px}
.header p{font-size:12px;opacity:.9}
.live-box{text-align:center;background:#1a1a1a;border:2px solid #333;border-radius:15px;padding:15px;margin-bottom:15px}
.live-dot{display:inline-block;width:15px;height:15px;background:#555;border-radius:50%;margin-right:8px}
.live-dot.on{background:#ff0000;box-shadow:0 0 15px #ff0000;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
#status{font-weight:bold;font-size:18px}
#listeners{color:#aaa;font-size:13px;margin-top:5px}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-bottom:10px}
.btn-live{background:#ff0000;color:#fff}
.btn-live.on{background:#00c853}
.btn-mic{background:#222;color:#fff;border:2px solid #444}
.btn-mic.on{background:#ff6600;border-color:#ff6600}
.btn-play{background:#fff;color:#000}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:15px}
.controls button{padding:12px;border:none;border-radius:10px;background:#222;color:#fff;font-size:16px}
.playlist{background:#1a1a1a;border-radius:15px;padding:15px}
.playlist h3{margin-bottom:10px;color:#ff6600}
#songList{list-style:none}
#songList li{padding:12px;background:#222;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
#songList li.playing{background:#ff0000}
#songList button{background:#ff6600;border:none;color:#fff;padding:6px 12px;border-radius:8px}
input[type=file]{display:none}
label.upload{display:block;text-align:center;background:#333;padding:13px;border-radius:12px;margin-bottom:10px;cursor:pointer}
audio{width:100%;margin-top:10px}
.vol{width:100%;margin:10px 0}
.small{font-size:12px;color:#aaa;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="header"><h1>🔥 DETONACIÓN 🔥</h1><p>RADIO BOSS ONLINE - EN VIVO</p></div>

<div class="live-box">
<span class="live-dot" id="dot"></span><span id="status">FUERA DEL AIRE</span>
<div id="listeners">Puente: Conectando...</div>
</div>

<button class="btn btn-live" id="btnLive">🔴 SALIR EN VIVO</button>
<button class="btn btn-mic" id="btnMic">🎤 MICRÓFONO: APAGADO</button>

<div class="controls">
<button id="btnPrev">⏮ Anterior</button>
<button id="btnPlay">▶ Play</button>
<button id="btnNext">⏭ Siguiente</button>
</div>

<label>🔊 Volumen</label>
<input type="range" class="vol" id="vol" min="0" max="100" value="80">

<div class="playlist">
<h3>🎵 MI PLAYLIST</h3>
<label class="upload" for="fileInput">➕ AGREGAR CANCIONES (MP3)</label>
<input type="file" id="fileInput" accept="audio/*" multiple>
<ul id="songList"><li style="text-align:center;color:#888">Sin canciones todavía. Agregá MP3.</li></ul>
<audio id="player" controls></audio>
</div>
<p class="small">Puente: wss://radio-boss-relay.onrender.com<br>Tu Radio Boss Online - Hecho para Detonación</p>

<script>
const RELAY = "wss://radio-boss-relay.onrender.com";
let ws=null, isLive=false, micOn=false, micStream=null, audioCtx=null, micSource=null, dest=null;
let songs=[], current=-1;
const player=document.getElementById('player');
const statusEl=document.getElementById('status');
const dot=document.getElementById('dot');
const listenersEl=document.getElementById('listeners');

function connect(){
  ws=new WebSocket(RELAY);
  ws.onopen=()=>{listenersEl.textContent="Puente: ✅ Conectado - Listo para salir al aire";};
  ws.onclose=()=>{listenersEl.textContent="Puente: ❌ Desconectado - Reintentando..."; setTimeout(connect,3000);};
  ws.onerror=()=>{listenersEl.textContent="Puente: Error de conexión";};
}
connect();

document.getElementById('btnLive').onclick=()=>{
  isLive=!isLive;
  const b=document.getElementById('btnLive');
  if(isLive){ b.textContent="🟢 ESTÁS EN VIVO - TOCÁ PARA CORTAR"; b.classList.add('on'); statusEl.textContent="🔴 EN VIVO - AL AIRE"; dot.classList.add('on'); if(ws) ws.send(JSON.stringify({type:"live_start"})); }
  else{ b.textContent="🔴 SALIR EN VIVO"; b.classList.remove('on'); statusEl.textContent="FUERA DEL AIRE"; dot.classList.remove('on'); }
};

document.getElementById('btnMic').onclick=async()=>{
  const b=document.getElementById('btnMic');
  if(!micOn){
    try{
      micStream=await navigator.mediaDevices.getUserMedia({audio:true});
      micOn=true; b.textContent="🎤 MICRÓFONO: ENCENDIDO - ESTÁS HABLANDO"; b.classList.add('on');
      // Baja la música cuando hablas
      player.volume=0.15;
    }catch(e){ alert("Permitile el micrófono al navegador, jefe"); }
  } else {
    micStream.getTracks().forEach(t=>t.stop()); micOn=false;
    b.textContent="🎤 MICRÓFONO: APAGADO"; b.classList.remove('on');
    player.volume=document.getElementById('vol').value/100;
  }
};

document.getElementById('fileInput').onchange=(e)=>{
  const files=[...e.target.files];
  files.forEach(f=>{ songs.push({name:f.name, url:URL.createObjectURL(f)}); });
  renderList();
  if(current===-1 && songs.length>0) playSong(0);
};
function renderList(){
  const ul=document.getElementById('songList'); ul.innerHTML="";
  songs.forEach((s,i)=>{
    const li=document.createElement('li'); if(i===current) li.classList.add('playing');
    li.innerHTML=`<span>${i===current?'▶ ':''}${s.name}</span><button onclick="playSong(${i})">Play</button>`;
    ul.appendChild(li);
  });
}
window.playSong=(i)=>{
  current=i; player.src=songs[i].url; player.play();
  document.getElementById('btnPlay').textContent="⏸ Pausa";
  renderList();
};
document.getElementById('btnPlay').onclick=()=>{
  if(!songs.length) return alert("Primero agregá canciones, jefe");
  if(player.paused){ player.play(); document.getElementById('btnPlay').textContent="⏸ Pausa"; }
  else{ player.pause(); document.getElementById('btnPlay').textContent="▶ Play"; }
};
document.getElementById('btnNext').onclick=()=>{ if(songs.length) playSong((current+1)%songs.length); };
document.getElementById('btnPrev').onclick=()=>{ if(songs.length) playSong((current-1+songs.length)%songs.length); };
document.getElementById('vol').oninput=(e)=>{ if(!micOn) player.volume=e.target.value/100; };
player.onended=()=>{ if(songs.length) playSong((current+1)%songs.length); };
player.volume=0.8;
</script>
</body>
</html>
